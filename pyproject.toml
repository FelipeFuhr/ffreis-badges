[project]
name = "ffreis-badges"
version = "0.1.0"
requires-python = ">=3.12"
description = "Public badge-data mirror poller for the repo fleet (stdlib-only scripts, no runtime deps)."
dependencies = []

# This repo is a set of standalone scripts (scripts/*.py), not an installable
# package — no src/ layout, no console entry points. Tell uv to only manage
# the dev dependency group, not build/install this project itself.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=scripts",
    "--cov-report=term-missing",
    "--cov-fail-under=75",
]
